[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plexus"
version = "0.0.1"
description = "Reachability, not topology: diagnosing graph attention masks in masked diffusion language models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "networkx>=3.2",
    "einops>=0.7",
    "transformers>=4.44,<5.0",  # 5.x renames _tied_weights_keys and breaks LLaDA remote code
    "tokenizers>=0.19",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rich>=13.7",
    "tqdm>=4.66",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "ogb>=1.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
]
log = ["wandb>=0.17"]

# torch is installed separately against the CUDA 12.1 wheel index:
#   pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu121
# titan3's driver (530.x) will not run cu124+ builds at all. ai-lab2's driver (550.144.03) would,
# but we hold both hosts at cu121 so throughput and accuracy numbers stay comparable across the
# migration. cu121 supports sm_89 (Ada), so the 4090s are fine on it.

[tool.setuptools.packages.find]
include = ["plexus*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
